{% extends "base.html" %}

{% block content %}
  <h1>Car with id <strong>{{ car.id }}({{ car.model }})</strong> delete</h1>
  <p>Are you sure that you want to delete this vehicle?</p>
  <form action="" method="post">
    {% csrf_token %}
    <input class="btn btn-danger" type="submit" value="Yes, delete">
  </form>
{% endblock %}
